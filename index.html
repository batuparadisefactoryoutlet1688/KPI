<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Masuk | KPI</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="login-page">
  <section class="login-side">
    <img src="assets/logo.png" alt="" width="72" height="72">
    <h1>KPI</h1>
    <p>Penilaian kinerja karyawan dari para Manager dan Supervisor, dihitung otomatis dan transparan.</p>
  </section>
  <main class="login-main">
    <div class="login-card">
      <h2>Masuk</h2>
      <form id="loginForm" novalidate>
        <label class="field"><span>Username</span><input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
        <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
        <div id="loginError" class="form-error" role="alert" hidden></div>
        <button type="submit" class="btn btn-primary btn-block" id="loginButton">Masuk</button>
      </form>
    </div>
  </main>
</div>
<div id="toastHost" class="toast-host" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/login.js"></script>
</body>
</html>
