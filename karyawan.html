<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Data Karyawan | KPI</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-toggle" id="menuToggle" aria-label="Buka menu">&#9776;</button>
      <h1 id="pageTitle">Data Karyawan</h1>
    </header>
    <main class="content" id="content">
      <section class="panel">
        <div class="toolbar">
          <input type="search" id="filterSearch" placeholder="Cari nama..." aria-label="Cari nama">
          <select id="filterDept" aria-label="Departemen"><option value="">Semua departemen</option></select>
          <select id="filterStatus" aria-label="Status">
            <option value="">Semua status</option>
            <option value="Aktif">Aktif</option>
            <option value="Nonaktif">Nonaktif</option>
          </select>
          <span class="spacer"></span>
          <button type="button" class="btn" id="btnBulkEmployee">Tempel Banyak</button>
          <button type="button" class="btn btn-primary" id="btnAddEmployee">+ Tambah Karyawan</button>
        </div>
        <p class="muted small" id="employeeCount"></p>
        <div id="employeeTable"></div>
      </section>
    </main>
  </div>
</div>
<div id="toastHost" class="toast-host" aria-live="polite"></div>
<div id="modalHost"></div>
<div id="confirmHost"></div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/karyawan.js"></script>
</body>
</html>
