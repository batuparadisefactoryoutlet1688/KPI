<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ganti Password | KPI</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-toggle" id="menuToggle" aria-label="Buka menu">&#9776;</button>
      <h1 id="pageTitle">Ganti Password</h1>
    </header>
    <main class="content" id="content">
      <section class="panel" style="max-width:28rem">
        <form id="passwordForm" novalidate>
          <label class="field"><span>Password lama</span><input name="oldPassword" type="password" autocomplete="current-password" required></label>
          <label class="field"><span>Password baru</span><input name="newPassword" type="password" autocomplete="new-password" minlength="8" required><small>Minimal 8 karakter.</small></label>
          <label class="field"><span>Ulangi password baru</span><input name="confirmPassword" type="password" autocomplete="new-password" required></label>
          <div id="formError" class="form-error" hidden></div>
          <button type="submit" class="btn btn-primary">Simpan password</button>
        </form>
      </section>
    </main>
  </div>
</div>
<div id="toastHost" class="toast-host" aria-live="polite"></div>
<div id="modalHost"></div>
<div id="confirmHost"></div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/password.js"></script>
</body>
</html>
