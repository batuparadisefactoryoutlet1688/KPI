<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ranking | KPI</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/print.css" media="print">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="menu-backdrop" id="menuBackdrop"></div>
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn menu-toggle" id="menuToggle" aria-label="Buka menu">&#9776;</button>
      <h1 id="pageTitle">Ranking</h1>
    </header>
    <main class="content" id="content">
      <div class="print-only print-header" id="printHeader"></div>
      <section class="panel">
        <div class="toolbar">
          <select id="rankCategory" aria-label="Kategori ranking"></select>
          <select id="rankTop" aria-label="Jumlah tampil"></select>
          <select id="rankDept" aria-label="Departemen"><option value="">Semua departemen</option></select>
          <select id="rankStatus" aria-label="Status karyawan">
            <option value="Aktif">Karyawan aktif</option>
            <option value="Nonaktif">Karyawan nonaktif</option>
            <option value="ALL">Semua status</option>
          </select>
          <input type="search" id="rankSearch" placeholder="Cari nama..." aria-label="Cari nama">
          <label class="check-row"><input type="checkbox" id="rankEligible"> Hanya yang memenuhi syarat</label>
        </div>
        <div class="toolbar">
          <span class="spacer"></span>
          <button type="button" class="btn" id="btnRefreshRanking">Perbarui sheet ranking</button>
          <button type="button" class="btn" id="btnCsvRanking">Unduh Excel</button>
          <button type="button" class="btn btn-primary" id="btnPrintRanking">Cetak / PDF</button>
        </div>
        <p class="muted small" id="rankingInfo"></p>
        <div id="rankingTable"></div>
        <p class="muted small">Peringkat dihitung di dalam hasil filter. Nilai yang sama mendapat peringkat yang sama. Karyawan dengan sedikit penilai tetap tampil, bedakan lewat kolom Jumlah penilai dan Status ranking.</p>
      </section>
    </main>
  </div>
</div>
<div id="toastHost" class="toast-host" aria-live="polite"></div>
<div id="modalHost"></div>
<div id="confirmHost"></div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/ranking.js"></script>
</body>
</html>
